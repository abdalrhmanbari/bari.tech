<svg width="600" height="680" viewBox="0 0 600 680" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Portrait placeholder">
  <defs>
    <radialGradient id="disc" cx="32%" cy="22%" r="82%">
      <stop offset="0%" stop-color="#242424" />
      <stop offset="55%" stop-color="#1a1a1a" />
      <stop offset="100%" stop-color="#131313" />
    </radialGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#414141" />
      <stop offset="100%" stop-color="#282828" />
    </linearGradient>
  </defs>

  <!-- right-hand dimension line -->
  <g stroke="#333333" stroke-width="1">
    <line x1="566" y1="58" x2="566" y2="512" />
    <line x1="561" y1="58" x2="571" y2="58" />
    <line x1="561" y1="512" x2="571" y2="512" />
    <line x1="561" y1="285" x2="571" y2="285" />
  </g>

  <!-- machined disc -->
  <g transform="translate(300 285)">
    <circle r="236" stroke="url(#edge)" stroke-width="1" />
    <circle r="208" fill="url(#disc)" stroke="#333333" stroke-width="1" />
    <circle r="170" stroke="#2f2f2f" stroke-width="1" />
    <circle r="122" stroke="#2a2a2a" stroke-width="1" />
    <g stroke="#3a3a3a" stroke-width="1">
      <line x1="0" y1="-236" x2="0" y2="-218" />
      <line x1="0" y1="218" x2="0" y2="236" />
      <line x1="-236" y1="0" x2="-218" y2="0" />
      <line x1="218" y1="0" x2="236" y2="0" />
    </g>
    <text x="0" y="6" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="152" fill="#F2F2F2" letter-spacing="4">AB</text>
  </g>

  <!-- baseline + labels -->
  <line x1="160" y1="588" x2="440" y2="588" stroke="#333333" stroke-width="1" />
  <text x="300" y="618" text-anchor="middle" font-family="'Space Grotesk', system-ui, sans-serif" font-size="13" fill="#8a8a8a" letter-spacing="6">ABD ALRHMAN AL BARI</text>
  <text x="300" y="647" text-anchor="middle" font-family="'Space Grotesk', system-ui, sans-serif" font-size="10.5" fill="#5f5f5f" letter-spacing="4">FRONTEND DEVELOPER</text>
</svg>
